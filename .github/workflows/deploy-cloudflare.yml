name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI bundle
        run: npm run build

      - name: Validate Worker and assets
        run: npm run check

      - name: Deploy Worker
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 68beee80b1f17d2689fd93e17b615d70
          command: deploy

      - name: Explain skipped deploy
        if: env.CF_API_TOKEN == ''
        run: echo 'Cloudflare validation passed. Add the CLOUDFLARE_API_TOKEN repository secret to enable automatic production deploys.' >> "$GITHUB_STEP_SUMMARY"
